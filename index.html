<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mask | المتجر الفاخر</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f0f0f; color: #fff; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #d4af37; padding-bottom: 20px; }
        .logo { font-size: 40px; font-weight: bold; color: #d4af37; }
        .search-box { width: 90%; max-width: 600px; padding: 15px; font-size: 18px; border-radius: 10px; border: 1px solid #d4af37; background: #1a1a1a; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #1a1a1a; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); border: 1px solid #333; }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .info { padding: 15px; }
        .brand { color: #d4af37; font-size: 14px; font-weight: bold; }
        .name { font-size: 20px; font-weight: bold; margin: 5px 0; }
        .price { color: #4caf50; font-size: 24px; font-weight: bold; }
        .notes { background: #252525; border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 14px; }
        .tag { display: inline-block; background: #333; padding: 5px 10px; border-radius: 15px; margin: 2px; color: #ccc; }
        .btn-wa { display: block; background: #25d366; color: #000; text-align: center; padding: 10px; text-decoration: none; font-weight: bold; border-radius: 8px; margin-top: 10px; }
        .desc { font-size: 13px; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">THE MASK</div>
        <div style="color:#d4af37;">BEYOND THE FACE</div>
    </div>

    <input type="text" class="search-box" id="search" placeholder="🔍 ابحث عن اسم عطر (مثال: Aventus, Sauvage)..." oninput="filterProducts()">

    <div id="catalog" class="grid">جاري تحميل العطور الفاخرة...</div>

    <script>
        const dataUrl = 'https://raw.githubusercontent.com/hourane48-prog/-perfume-data/main/perfume_catalog.json';
        let allPerfumes = [];

        async function loadCatalog() {
            const res = await fetch(dataUrl);
            allPerfumes = await res.json();
            render(allPerfumes);
        }

        function render(perfumes) {
            const container = document.getElementById('catalog');
            container.innerHTML = '';
            perfumes.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                // تحسين عرض النوتات إذا كانت أرقام (مثل n123) -> سنعرضها كأرقام أنيقة
                const top = (p.top_notes && p.top_notes.length ? p.top_notes.map(n => n.replace('n','')).join(', ') : 'غير محدد');
                const heart = (p.heart_notes && p.heart_notes.length ? p.heart_notes.map(n => n.replace('n','')).join(', ') : 'غير محدد');
                const base = (p.base_notes && p.base_notes.length ? p.base_notes.map(n => n.replace('n','')).join(', ') : 'غير محدد');
                const waLink = `https://wa.me/962799305030?text=${encodeURIComponent('أريد طلب عطر: ' + p.name)}`;
                
                card.innerHTML = `
                    <img src="${p.image}" onerror="this.src='https://via.placeholder.com/300?text=The+Mask'">
                    <div class="info">
                        <div class="brand">${p.brand || 'THE MASK'}</div>
                        <div class="name">${p.name}</div>
                        <div class="price">${p.priceJOD || p.prices?.edp || 'غير محدد'} د.أ</div>
                        <div class="notes"><strong>الافتتاحية:</strong> ${top}</div>
                        <div class="notes"><strong>القلب:</strong> ${heart}</div>
                        <div class="notes"><strong>القاعدة:</strong> ${base}</div>
                        <div class="desc">${p.description ? p.description.substring(0, 80) + '...' : ''}</div>
                        <a href="${waLink}" target="_blank" class="btn-wa">🛒 اطلب عبر واتساب</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterProducts() {
            const q = document.getElementById('search').value.toLowerCase();
            const filtered = allPerfumes.filter(p => p.name.toLowerCase().includes(q) || (p.brand && p.brand.toLowerCase().includes(q)));
            render(filtered);
        }

        loadCatalog();
    </script>
</body>
</html>

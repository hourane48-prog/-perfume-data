<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mask | Haute Parfumerie</title>
    <style>
        body { background-color: #0d0d0d; color: #f0f0f0; font-family: Arial, sans-serif; margin: 0; padding: 15px; }
        .header { text-align: center; margin-bottom: 25px; }
        .logo { font-size: 34px; font-weight: bold; color: #d4af37; letter-spacing: 3px; }
        .sub-title { color: #777; font-size: 14px; letter-spacing: 2px; }
        .search-container { max-width: 500px; margin: 0 auto 20px; }
        #search-input { width: 100%; padding: 14px; border-radius: 20px; border: 1px solid #d4af37; background: #1a1a1a; color: white; font-size: 16px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #181818; border: 1px solid #333; border-radius: 12px; padding: 20px; text-align: center; }
        .card-brand { color: #d4af37; font-size: 11px; text-transform: uppercase; margin-bottom: 5px; }
        .card-name { color: white; font-size: 19px; font-weight: bold; margin-bottom: 20px; }
        .concentrations { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .btn-conc { background: #222; border: 1px solid #444; color: #aaa; padding: 8px 0; flex: 1; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .btn-conc.active { background: #d4af37; color: black; font-weight: bold; border-color: #d4af37; }
        .price-display { font-size: 24px; font-weight: bold; color: white; }
        .currency { font-size: 13px; color: #d4af37; }
        .rating { font-size: 12px; color: #4cff6e; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">THE MASK</div>
        <div class="sub-title">HAUTE PARFUMERIE & LUXURY</div>
    </div>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="🔍 ابحث عن عطرك المفضل..." onkeyup="filterPerfumes()">
    </div>

    <div id="loading" style="text-align:center; color:#d4af37;">جاري تحميل 525 عطر...</div>
    <div class="grid" id="perfume-grid"></div>

    <script>
        let perfumesData = [];

        // أزرار التركيز والأسعار
        const concentrations = {
            extra: { label: "إكسترا", mult: 1.0 },
            edp: { label: "أو دو بارفيوم", mult: 0.65 },
            edt: { label: "أو دو تواليت", mult: 0.50 },
            comm: { label: "شعبي", mult: 0.35 }
        };

        async function fetchPerfumes() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/hourane48-prog/-perfume-data/main/perfume_catalog.json');
                perfumesData = await res.json();
                document.getElementById('loading').style.display = 'none';
                renderPerfumes(perfumesData);
            } catch (e) {
                document.getElementById('loading').innerText = "خطأ في تحميل البيانات!";
            }
        }

        function getPrice(perfume, type) {
            // نستخدم السعر الأساسي ثم نضرب بمعامل التركيز
            const basePrice = perfume.price || 25;
            return (basePrice * concentrations[type].mult).toFixed(1);
        }

        function renderPerfumes(data) {
            const grid = document.getElementById('perfume-grid');
            grid.innerHTML = '';
            data.slice(0, 150).forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-brand">${p.brand || 'THE MASK'}</div>
                    <div class="card-name">${p.name}</div>
                    <div class="rating">⏱️ ثبات: ${p.longevity_hours || 'N/A'} ساعة | 💨 فوحان: ${p.sillage || 'N/A'}/10</div>
                    <div class="concentrations">
                        <button class="btn-conc active" onclick="changePrice('extra', ${index}, this)">${concentrations.extra.label}</button>
                        <button class="btn-conc" onclick="changePrice('edp', ${index}, this)">${concentrations.edp.label}</button>
                        <button class="btn-conc" onclick="changePrice('edt', ${index}, this)">${concentrations.edt.label}</button>
                        <button class="btn-conc" onclick="changePrice('comm', ${index}, this)">${concentrations.comm.label}</button>
                    </div>
                    <div class="price-display" id="price-${index}">${getPrice(p, 'extra')} <span class="currency">JOD</span></div>
                `;
                grid.appendChild(card);
            });
        }

        function changePrice(type, index, btn) {
            const p = perfumesData[index];
            document.querySelectorAll(`#price-${index}`).forEach(() => {});
            const priceEl = document.getElementById(`price-${index}`);
            priceEl.style.opacity = 0;
            setTimeout(() => {
                priceEl.innerHTML = `${getPrice(p, type)} <span class="currency">JOD</span>`;
                priceEl.style.opacity = 1;
            }, 150);
            const concBtns = btn.parentElement.children;
            for (let b of concBtns) b.classList.remove('active');
            btn.classList.add('active');
        }

        function filterPerfumes() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const filtered = perfumesData.filter(p => p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q));
            renderPerfumes(filtered);
        }

        fetchPerfumes();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر The Mask Pro-Lab</title>
    
    <!-- استيراد مكتبات Firebase (الطريقة الآمنة) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyAp4NNm0yXsEMVpGhtEVMvDGqvp7P8X01U",
            authDomain: "the-mask-security.firebaseapp.com",
            projectId: "the-mask-security",
            storageBucket: "the-mask-security.firebasestorage.app",
            messagingSenderId: "824767222562",
            appId: "1:824767222562:web:6b8954cb95196e0aaf8b7b",
            measurementId: "G-37Q2ZS9M36"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // دالة تسجيل الدخول
        window.checkPass = async function() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passInput').value;
            const errMsg = document.getElementById('err');
            errMsg.innerText = "";
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                // سيتم تفعيل لوحة التحكم تلقائياً عند نجاح الدخول
            } catch (error) {
                const errorCode = error.code;
                if (errorCode === 'auth/invalid-credential') {
                    errMsg.innerText = "البريد الإلكتروني أو كلمة المرور غير صحيحة!";
                } else {
                    errMsg.innerText = "حدث خطأ، حاول مجدداً.";
                }
            }
        };

        // دالة تسجيل الخروج
        window.logOut = async function() {
            await signOut(auth);
        };

        // مراقبة حالة الدخول (هل أنت مسجل دخول؟)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // إذا تم تسجيل الدخول بنجاح
                document.getElementById('lockScreen').classList.add('hidden');
                document.getElementById('labPanel').classList.remove('hidden');
                loadProducts();
            } else {
                // إذا تم تسجيل الخروج
                document.getElementById('lockScreen').classList.remove('hidden');
                document.getElementById('labPanel').classList.add('hidden');
            }
        });
    </script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: #fff; padding: 20px; }
        .lock { text-align: center; margin-top: 50px; }
        input { padding: 10px; width: 300px; border: 1px solid #d4af37; border-radius: 5px; background: #222; color: #fff; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #d4af37; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        .panel { background: #252525; padding: 20px; border-radius: 10px; }
        h2, h1 { color: #d4af37; }
        .form-row { margin-bottom: 10px; }
        .form-row input, .form-row textarea { width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <!-- شاشة القفل -->
    <div id="lockScreen" class="lock">
        <h1>🔒 مختبر The Mask</h1>
        <p>أدخل بريد المعمل وكلمة المرور</p>
        <input type="email" id="emailInput" placeholder="owner@themask.com">
        <input type="password" id="passInput" placeholder="كلمة المرور">
        <button onclick="checkPass()">دخول</button>
        <p id="err" style="color:red;"></p>
    </div>

    <!-- لوحة التحكم -->
    <div id="labPanel" class="hidden">
        <h2>⚗️ محرك التصنيع والتراكيب</h2>
        <p>مرحباً بك يا صانع العطور! هذه لوحة إدارة الإنتاج.</p>
        <button onclick="logOut()" style="background:red; float:left;">تسجيل الخروج</button>
        <div class="panel">
            <h3>إضافة / تعديل عطر في المتجر:</h3>
            <div class="form-row"><input type="text" id="pName" placeholder="اسم العطر"></div>
            <div class="form-row"><input type="text" id="pBrand" placeholder="البراند"></div>
            <div class="form-row"><input type="number" id="pPrice" placeholder="السعر (د.أ)"></div>
            <div class="form-row"><input type="text" id="pImage" placeholder="رابط صورة العطر (URL)"></div>
            <div class="form-row"><textarea id="pNotes" placeholder="النوتات: افتتاحية, قلب, قاعدة"></textarea></div>
            <button onclick="alert('تم حفظ العطر. لرفعه فعلياً يرجى استخدام Termux.')">💾 حفظ العطر</button>
            <hr>
            <h3>قائمة المنتجات الحالية:</h3>
            <div id="prodList"></div>
        </div>
    </div>

    <script>
        // تحميل المنتجات من GitHub (قراءة فقط)
        async function loadProducts() {
            const res = await fetch('https://raw.githubusercontent.com/hourane48-prog/-perfume-data/main/perfume_catalog.json');
            window.allProds = await res.json();
            renderList();
        }

        function renderList() {
            const list = document.getElementById('prodList');
            list.innerHTML = '';
            window.allProds.forEach((p, idx) => {
                list.innerHTML += `<div style="border-bottom:1px solid #444;padding:10px;">${p.name} - ${p.priceJOD} د.أ <button onclick="alert('سيتم الحذف عند تحديث الملف يدوياً.')">🗑️ حذف</button></div>`;
            });
        }
    </script>
</body>
</html>
